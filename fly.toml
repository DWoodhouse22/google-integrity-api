# fly.toml app configuration file generated for google-integrity-api on 2026-02-25T12:03:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'google-integrity-api'
primary_region = 'lhr'

[build]
  [build.args]
    GO_VERSION = '1.26.0'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
